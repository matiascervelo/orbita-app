<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0F14" />
  <meta name="description" content="Órbita — notícias que importam, sob a sua perspectiva." />
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>Órbita — Seu mundo. Em perspectiva.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="styles.css?v=4" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#hoje" aria-label="Órbita — início">
        <svg class="brand-symbol" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><defs><linearGradient id="orbitaMarkGradient" x1="0" y1="50" x2="100" y2="50" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#2563EB"/><stop offset="0.50" stop-color="#258DFF"/><stop offset="1" stop-color="#22D3EE"/></linearGradient></defs><path d="M 63 14 A 37 37 0 1 0 86 65" fill="none" stroke="url(#orbitaMarkGradient)" stroke-width="15" stroke-linecap="butt"/><circle cx="79" cy="17" r="11.5" fill="#22D3EE"/></svg>
        <span class="brand-wordmark">Órbita</span>
      </a>
      <div class="top-actions"><span class="demo-pill"><span class="demo-dot"></span> Piloto RSS 0.3</span><button class="circle-button theme-toggle" id="themeToggle" aria-label="Alternar modo de aparência" title="Alternar modo claro ou escuro"><svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5 8.5 8.5 0 1 0 20.5 14.5Z"/></svg></button></div>
    </header>

    <div class="desktop-frame">
      <aside class="side-menu" aria-label="Navegação principal">
        <p class="side-caption">SEU ESPAÇO</p>
        <button data-page="hoje" class="side-link active"><span class="nav-icon" data-icon="home"></span> Hoje</button>
        <button data-page="editorias" class="side-link"><span class="nav-icon" data-icon="grid"></span> Editorias</button>
        <button data-page="salvos" class="side-link"><span class="nav-icon" data-icon="bookmark"></span> Salvos <span class="saved-badge" id="sideSavedCount">0</span></button>
        <button data-page="historico" class="side-link"><span class="nav-icon" data-icon="clock"></span> Histórico</button>
        <button data-page="ajustes" class="side-link"><span class="nav-icon" data-icon="sliders"></span> Meu Órbita</button>
        <div class="side-note"><span class="sparkle">✳</span><p>O essencial. Sem ruído.<br><strong>Feito para você.</strong></p></div>
      </aside>
      <main id="app" tabindex="-1"></main>
    </div>
    <nav class="bottom-nav" aria-label="Navegação inferior">
      <button data-page="hoje" class="bottom-link active"><span data-icon="home" class="nav-icon"></span><span>Hoje</span></button>
      <button data-page="editorias" class="bottom-link"><span data-icon="grid" class="nav-icon"></span><span>Editorias</span></button>
      <button data-page="salvos" class="bottom-link"><span data-icon="bookmark" class="nav-icon"></span><span>Salvos</span></button>
      <button data-page="historico" class="bottom-link"><span data-icon="clock" class="nav-icon"></span><span>Histórico</span></button>
      <button data-page="ajustes" class="bottom-link"><span data-icon="sliders" class="nav-icon"></span><span>Meu Órbita</span></button>
    </nav>
  </div>
  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js?v=4" defer></script>
</body>
</html>
