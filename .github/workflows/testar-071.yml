
name: Órbita 0.7.1 - Prévia sem publicar

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  previa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Testar versão 0.7.1 offline
        run: python3 -m unittest discover -s tests -p 'test_coletor_071.py' -v
      - name: Gerar briefing 0.7.1 (sem publicar)
        run: python3 coletor_071.py --out data/briefing_preview_071.json
      - name: Disponibilizar relatório para análise
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: orbita-071-previa
          path: data/briefing_preview_071.json
          if-no-files-found: error
          retention-days: 7
