name: Atualizar manchetes gratuitas

on:
  workflow_dispatch:
  schedule:
    - cron: '11 10 * * *'

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Coletar manchetes RSS
        run: python coletor.py
      - name: Publicar edicao coletada
        run: |
          git config user.name "orbita-bot"
          git config user.email "orbita-bot@users.noreply.github.com"
          git add data/briefing.json
          git diff --cached --quiet || (git commit -m "Atualiza manchetes RSS" && git push)
